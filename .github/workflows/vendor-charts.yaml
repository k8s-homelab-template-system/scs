name: Vendor charts

# Tải các chart con trong Chart.yaml từ ghcr.io về charts/ rồi commit Chart.lock + charts/*.tgz,
# để Fleet deploy mà không cần đăng nhập ghcr.io.
# GITHUB_TOKEN của repo scs cần quyền Read trên từng package charts/<name>
# (Package settings -> Manage Actions access).

on:
  push:
    branches: [main]
    paths: [Chart.yaml]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: vendor-charts
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Update dependencies
        run: |
          rm -f charts/*.tgz
          helm dependency update .

      - name: Lint
        run: helm lint .

      - name: Commit
        run: |
          git add Chart.lock charts
          if git diff --cached --quiet; then
            echo "::notice::Charts already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor charts for $(git log -1 --format=%h -- Chart.yaml)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
