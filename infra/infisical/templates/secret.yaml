{{- /*
Credential của chính Infisical. Sinh ngẫu nhiên một lần rồi giữ nguyên khi upgrade (lookup).
ENCRYPTION_KEY mã hoá toàn bộ secret trong DB: mất key này là mất dữ liệu, hãy backup Secret.
*/ -}}
{{- $get := dict }}
{{- range $key := list "ENCRYPTION_KEY" "AUTH_SECRET" "postgres-password" "password" "redis-password" }}
{{- $_ := set $get $key (include "homelab.infisical.storedCredential" (dict "key" $key "context" $)) }}
{{- end }}
{{- $encryptionKey := $get.ENCRYPTION_KEY | default (randAlphaNum 64 | sha256sum | trunc 32) }}
{{- $authSecret := $get.AUTH_SECRET | default (randAlphaNum 32 | b64enc) }}
{{- $postgresPassword := index $get "postgres-password" | default (randAlphaNum 24) }}
{{- $password := $get.password | default (randAlphaNum 24) }}
{{- $redisPassword := index $get "redis-password" | default (randAlphaNum 24) }}
{{- $pg := .Values.postgresql }}
apiVersion: v1
kind: Secret
metadata:
  name: infisical-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Giữ Secret khi gỡ release: dữ liệu trong DB chỉ giải mã được bằng đúng ENCRYPTION_KEY này.
    helm.sh/resource-policy: keep
type: Opaque
data:
  ENCRYPTION_KEY: {{ $encryptionKey | b64enc | quote }}
  AUTH_SECRET: {{ $authSecret | b64enc | quote }}
  postgres-password: {{ $postgresPassword | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
  redis-password: {{ $redisPassword | b64enc | quote }}
  DB_CONNECTION_URI: {{ printf "postgresql://%s:%s@%s:5432/%s" $pg.auth.username $password $pg.fullnameOverride $pg.auth.database | b64enc | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s-master:6379" $redisPassword .Values.redis.fullnameOverride | b64enc | quote }}
