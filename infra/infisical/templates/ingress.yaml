{{- /*
Thay cho Ingress của chart infisical-standalone: chỉ dùng pathType Prefix vì Cloudflare Tunnel
Ingress Controller không hỗ trợ Exact. Path / đã bao gồm /ss-webhook.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infisical
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # cloudflared đổi POST thân rỗng (vd. /api/v1/auth/token) thành chunked không có Content-Type,
    # Infisical (Fastify) trả 500 "Unsupported Media Type" làm không đăng nhập được.
    cloudflare-tunnel-ingress-controller.strrl.dev/disable-chunked-encoding: "true"
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.ingress.hostName }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ index .Values "infisical-standalone" "infisical" "fullnameOverride" }}
                port:
                  number: 8080
