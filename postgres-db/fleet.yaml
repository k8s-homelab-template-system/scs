# Fleet tự kéo chart từ ghcr.io bằng Secret ghcr-helm-auth
# (GitRepo: helmSecretName + helmRepoURLRegex).
defaultNamespace: homelab

helm:
  releaseName: postgres-db
  chart: oci://ghcr.io/k8s-homelab-template-system/charts/postgres-db
  version: 0.2.0
  # Ghi đè values của components/postgres-db ở đây, ví dụ:
  values: {}
  #   postgresql:
  #     primary:
  #       persistence:
  #         size: 20Gi
