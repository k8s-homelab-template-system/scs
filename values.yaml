postgres-db:
  enabled: true
  # Ghi đè values của components/postgres-db ở đây, ví dụ:
  # postgresql:
  #   primary:
  #     persistence:
  #       size: 20Gi

rabbitmq:
  enabled: true
  # Ghi đè values của components/rabbitmq ở đây, ví dụ:
  # rabbitmq:
  #   persistence:
  #     size: 5Gi
  #   ingress:            # mở management UI
  #     enabled: true
  #     hostname: rabbitmq.homelab.local
