global:
  # Domain gốc dùng chung cho Ingress của mọi component: host = <subdomain>.<baseDomain>.
  # Public hostname tương ứng tạo trên Cloudflare Tunnel, trỏ về ingress controller.
  baseDomain: vodka.bid

postgres-db:
  enabled: true
  # Ghi đè values của components/postgres-db ở đây, ví dụ:
  # postgresql:
  #   primary:
  #     persistence:
  #       size: 20Gi

rabbitmq:
  enabled: true
  rabbitmq:
    # Management UI: rabbitmq-mgm.<global.baseDomain>, qua Cloudflare Tunnel (Cloudflare lo TLS).
    ingress:
      enabled: true
      # subdomain: rabbitmq-mgm   # mặc định của component
