postgres-db:
  enabled: true
  # Ghi đè values của components/postgres-db ở đây, ví dụ:
  # postgresql:
  #   primary:
  #     persistence:
  #       size: 20Gi

rabbitmq:
  enabled: true
  rabbitmq:
    # Management UI qua Cloudflare Tunnel: public hostname rabbitmq-mgm.<domain>
    # trỏ về http://traefik.kube-system.svc.cluster.local:80. Cloudflare lo TLS,
    # nên Ingress chỉ cần HTTP. Domain: vodka.bid.
    ingress:
      enabled: true
      hostname: rabbitmq-mgm.vodka.bid
      tls: false
